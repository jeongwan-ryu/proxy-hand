<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProxyHand 조종 화면</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 조종 화면 (관제 서비스가 제공) — 담당: 이보연
       받는 것: ui/state, ui/alert (WebSocket ws://<관제>/ws)  /  보내는 것: ui/cmd
       영상 주소는 ui/state에 있는 것만 씀 (map_video_url, hand_video_url, cars.n.video_url)
       배치: 시스템 설계 12장, 모양: docs/design/control_screen_stitch.html (인터넷 없이 뜨도록 CSS 파일 하나로 옮김)
       관련 SR: SR-31~35, SR-40 / 메시지: 인터페이스 정의 6장 -->

  <!-- 맨 위 줄: 스크롤해도 붙어 있음 -->
  <header class="top">
    <div class="brand"><span class="logo">P</span><span class="brand-name">ProxyHand</span></div>
    <div class="legend" aria-label="모드 색">
      <span class="chip mode-idle">대기</span>
      <span class="chip mode-manual">조종</span>
      <span class="chip mode-teach">가르치기</span>
      <span class="chip mode-auto">혼자 하기</span>
      <span class="chip mode-stopped">정지</span>
    </div>
    <div class="status-item"><span class="label">손 인식</span><span id="top-hand" class="dot-text bad">● 확인 중</span></div>
    <div class="status-item"><span class="label">맵 비전</span><span id="top-vision" class="dot-text bad">● 확인 중</span></div>
    <button id="btn-stop-all" class="btn stop-all" type="button">■ 전체 정지 <kbd>Space</kbd></button>
  </header>

  <!-- 관제와 연결이 끊겼을 때만 보임 -->
  <div id="conn-banner" class="conn-banner" hidden>관제 연결 끊김 — 1초마다 다시 접속합니다. 버튼은 다시 연결될 때까지 눌리지 않습니다.</div>
  <div id="space-flash" class="space-flash" hidden>전체 정지 보냄</div>

  <main class="page">
    <!-- 작업차 두 칸 (app.js가 template으로 채움) -->
    <section class="cars" id="cars"></section>

    <!-- 아래쪽 칸 -->
    <section class="bottom">
      <div class="panel map-panel">
        <h3 class="panel-title">맵 위 영상</h3>
        <div class="video map-video">
          <img id="map-img" alt="">
          <div class="video-empty" id="map-empty">영상 없음</div>
        </div>
      </div>

      <div class="panel field-panel">
        <h3 class="panel-title">보관함</h3>
        <ul class="slots" id="slots">
          <li data-slot="1"><span class="slot-name">1번</span><span class="marker"></span></li>
          <li data-slot="2"><span class="slot-name">2번</span><span class="marker"></span></li>
          <li data-slot="3"><span class="slot-name">3번</span><span class="marker"></span></li>
        </ul>
        <h3 class="panel-title sep">작업대</h3>
        <dl class="rows">
          <div><dt>작업대</dt><dd id="bench"></dd></div>
          <div><dt>바이알</dt><dd id="bench-vial"></dd></div>
          <div><dt>콕 LED</dt><dd id="cock-led"></dd></div>
        </dl>
      </div>

      <div class="right-col">
        <div class="panel hand-panel">
          <h3 class="panel-title">손 인식</h3>
          <div class="hand-row">
            <div class="hand-video-wrap">
              <div class="video hand-video" id="hand-video">
                <img id="hand-img" alt="">
                <div class="video-empty" id="hand-empty">영상 없음</div>
              </div>
              <div class="hand-note" id="hand-note"></div>
            </div>
            <div class="hand-side">
              <div id="hand-state" class="dot-text"></div>
              <div id="hand-calib" class="muted"></div>
              <button class="btn" type="button" id="btn-calib-open">손 펴기 기록</button>
              <button class="btn" type="button" id="btn-calib-fist">주먹 기록</button>
            </div>
          </div>
        </div>
        <div class="panel alert-panel">
          <h3 class="panel-title">알림 <span class="muted small">(새로 고침하면 비워짐)</span></h3>
          <ol class="alerts" id="alerts"></ol>
        </div>
      </div>
    </section>
  </main>

  <!-- 작업차 칸 하나 -->
  <template id="car-template">
    <article class="panel car">
      <div class="ribbon"></div>
      <div class="car-head">
        <h2 class="car-name"></h2>
        <button class="select-chip" type="button" data-act="select"><span class="radio"></span>조종 대상</button>
        <span class="link dot-text"></span>
      </div>

      <div class="car-body">
        <div class="video car-video">
          <img class="car-img" alt="">
          <div class="video-empty">영상 없음</div>
        </div>
        <div class="car-status">
          <div class="mode-label">모드</div>
          <div class="mode-badge"></div>
          <dl class="rows">
            <div><dt>위치</dt><dd class="where"></dd></div>
            <div><dt>파이</dt><dd class="pi"></dd></div>
            <div><dt>진행</dt><dd class="progress"></dd></div>
          </dl>
        </div>
      </div>

      <div class="btn-row modes">
        <button class="btn" type="button" data-act="set_mode:idle">대기</button>
        <button class="btn" type="button" data-act="set_mode:manual">조종</button>
        <button class="btn" type="button" data-act="set_mode:teach">가르치기</button>
        <button class="btn" type="button" data-act="record_end">기록 끝</button>
        <button class="btn stop" type="button" data-act="stop">정지</button>
      </div>

      <!-- [기록 끝]을 누르면 열림 (브라우저 팝업은 스페이스바를 가로채므로 쓰지 않음) -->
      <div class="inline-box record-box" hidden>
        <span>작업 이름</span>
        <input class="record-name" type="text" maxlength="40" placeholder="예: 분주_1회 (공백 대신 _)">
        <button class="btn primary" type="button" data-act="record_save">저장</button>
        <button class="btn" type="button" data-act="record_cancel">취소</button>
      </div>

      <div class="sub">
        <div class="sub-head"><span class="sub-title">정거장</span></div>
        <div class="stations"></div>
        <div class="set-station">
          <select class="set-station-select" aria-label="위치 지정 정거장"></select>
          <button class="btn" type="button" data-act="set_station">위치 지정</button>
        </div>
      </div>

      <div class="sub task-row">
        <span class="sub-title">작업</span>
        <select class="task-select" aria-label="작업"></select>
        <button class="btn" type="button" data-act="delete_ask">삭제</button>
        <label class="repeat"><input type="checkbox" class="repeat-box"> 반복</label>
        <button class="btn primary" type="button" data-act="start">시작</button>
      </div>
      <div class="inline-box delete-box" hidden>
        <span class="delete-text"></span>
        <button class="btn stop" type="button" data-act="delete_yes">지우기</button>
        <button class="btn" type="button" data-act="delete_no">취소</button>
      </div>

      <div class="sub result-row">
        <span class="sub-title">결과</span>
        <span class="result-cycle muted"></span>
        <button class="btn ok" type="button" data-act="success">성공</button>
        <button class="btn ng" type="button" data-act="fail">실패</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
