<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="바이알 위치가 바뀌었을 때 노트북, 라즈베리 파이, AiHand가 차례로 하는 일">
<style>
text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#1d2327}
.tb{font-size:13.5px;font-weight:700}
.ts{font-size:11.5px;fill:#5d6870}
.tm{font-family:Consolas,'IBM Plex Mono',monospace;font-size:11.5px;fill:#0f7b8a}
.tw{font-size:11.5px;fill:#2f6fd6;font-weight:500}
.z1{fill:#e9f0fb} .z2{fill:#f6ecf7}
.box{fill:#ffffff;stroke:#1d2327;stroke-width:1.3}
.boxa{fill:#dff1f3;stroke:#0f7b8a;stroke-width:1.5}
.arr{fill:none;stroke:#1d2327;stroke-width:1.5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1d2327"/></marker></defs>
<rect width="800" height="400" fill="#ffffff"/>
<rect x="10" y="15" width="780" height="115" rx="8" class="z1"/>
<rect x="10" y="140" width="780" height="115" rx="8" class="z2"/>
<rect x="10" y="265" width="780" height="115" rx="8" class="z1"/>
<text x="22" y="62" class="tb">노트북</text><text x="22" y="80" class="ts">+ 맵 위 웹캠</text>
<text x="22" y="187" class="tb">라즈베리 파이</text><text x="22" y="205" class="ts">(작업차 1)</text>
<text x="22" y="312" class="tb">AiHand</text><text x="22" y="330" class="ts">micro:bit</text>

<!-- 1 -->
<rect x="115" y="27" width="130" height="92" rx="6" class="box"/>
<text x="124" y="47" class="tb">① 바이알 찾기</text>
<text x="124" y="66" class="ts">wait_1에 있을 때</text>
<text x="124" y="81" class="ts">칸 바닥 마커 1·3번 보임</text>
<text x="124" y="96" class="ts">2번 가려짐</text>
<text x="124" y="112" class="tm">→ 2번 칸</text>
<!-- 2 -->
<rect x="265" y="27" width="118" height="92" rx="6" class="box"/>
<text x="274" y="47" class="tb">② 이동 명령</text>
<text x="274" y="70" class="tm">car1/goto</text>
<text x="274" y="86" class="tm">storage_2</text>
<path d="M245 73 L263 73" class="arr" marker-end="url(#a)"/>
<!-- 3 -->
<rect x="345" y="152" width="150" height="92" rx="6" class="box"/>
<text x="354" y="172" class="tb">③ 주행</text>
<text x="354" y="191" class="ts">선 따라가며 정지선 세기</text>
<text x="354" y="207" class="ts">구간 시간이 너무 길면</text>
<text x="354" y="223" class="ts">멈추고 line_missed</text>
<path d="M345 119 L385 150" class="arr" marker-end="url(#a)"/>
<text x="372" y="134" class="tw">Wi-Fi</text>
<!-- 4 -->
<rect x="515" y="152" width="122" height="92" rx="6" class="box"/>
<text x="524" y="172" class="tb">④ 도착</text>
<text x="524" y="191" class="ts">2번째 정지선에서</text>
<text x="524" y="207" class="ts">멈춤</text>
<text x="524" y="229" class="tm">→ arrived 보고</text>
<path d="M495 198 L513 198" class="arr" marker-end="url(#a)"/>
<!-- 5 -->
<rect x="630" y="27" width="150" height="92" rx="6" class="boxa"/>
<text x="639" y="47" class="tb">⑤ 동작 재생</text>
<text x="639" y="66" class="ts">저장한 집기 동작의</text>
<text x="639" y="82" class="ts">손 각도를 차례로 보냄</text>
<text x="639" y="98" class="ts">(어느 칸이든 같은 동작)</text>
<path d="M600 152 L650 121" class="arr" marker-end="url(#a)"/>
<text x="606" y="134" class="tw">Wi-Fi</text>
<!-- 6 -->
<rect x="630" y="285" width="150" height="70" rx="6" class="boxa"/>
<text x="639" y="312" class="tb">⑥ 손이 바이알을 집음</text>
<text x="639" y="333" class="tm">시리얼 M 명령</text>
<path d="M740 121 L740 283" class="arr" marker-end="url(#a)"/>
<text x="733" y="200" text-anchor="end" class="tw">Wi-Fi → 파이</text>
<text x="733" y="216" text-anchor="end" class="ts">→ USB 시리얼</text>
</svg>
